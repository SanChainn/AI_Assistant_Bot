version: "3.9"

# Shared log rotation so containers never fill the disk with logs
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    container_name: assistant-app
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Localhost only — nginx proxies public traffic to app:8000 internally
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network, services are reached by service name
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  celery_worker:
    build: .
    container_name: assistant-celery
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.worker worker --loglevel=info

  celery_beat:
    build: .
    container_name: assistant-celery-beat
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.worker beat --loglevel=info

  postgres:
    image: postgres:16-alpine
    container_name: assistant-postgres
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Localhost only — do not expose the database publicly
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-assistant_agent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: assistant-redis
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Localhost only — do not expose Redis publicly
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: assistant-qdrant
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Localhost only — do not expose Qdrant publicly
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  nginx:
    image: nginx:alpine
    container_name: assistant-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # For HTTPS, mount certificates and uncomment the HTTPS block in nginx/nginx.conf:
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
  qdrantdata:
