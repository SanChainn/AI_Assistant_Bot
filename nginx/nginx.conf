events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Telegram updates are small, but document uploads can be larger.
    # Adjust to taste (FastAPI must also raise its own limit if needed).
    client_max_body_size 20M;

    sendfile on;
    keepalive_timeout 65;

    upstream app {
        server app:8000;
    }

    # --- HTTP ---
    server {
        listen 80;
        server_name _;

        # Health check passthrough (used by uptime monitors on plain HTTP)
        location /api/v1/health {
            proxy_pass http://app;
            proxy_set_header Host $host;
        }

        # Once HTTPS is enabled below, redirect everything else to HTTPS
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }

    # --- HTTPS (required for Telegram webhooks) ---
    # 1) Put your certificate + key in ./nginx/certs/ (fullchain.pem / privkey.pem)
    # 2) Uncomment the certs volume mount in docker-compose.yml
    # 3) Uncomment this block and reload: docker compose exec nginx nginx -s reload
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     location / {
    #         proxy_pass http://app;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #         proxy_read_timeout 120s;
    #         proxy_send_timeout 120s;
    #     }
    # }
}